name: hastebin
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: rlister/hastebin:latest
    container_name: hastebin-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: hastebin-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      STORAGE_TYPE: ${HASTEBIN_STORAGE:-redis}
      STORAGE_HOST: hastebin-redis
      STORAGE_PORT: 6379
      STORAGE_DB: 2
      STORAGE_EXPIRE_SECONDS: ${HASTEBIN_EXPIRE:-2592000}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '7777']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - hastebin-redis
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://hastebin-app:7777'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - hastebin
      - cloudflare

  hastebin-redis:
    image: redis:alpine
    container_name: hastebin-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: hastebin-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: hastebin-redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/redis/hastebin:/data:z'
    networks:
      - hastebin

networks:
  hastebin:
    name: hastebin
    external: false
  cloudflare:
    external: true
